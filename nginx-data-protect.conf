# =====================================================
# data 目录防护（Nginx）—— 单独配置，别和伪静态混在一起
#
# 宝塔操作：网站 → 设置 → 配置文件（不是"伪静态"）→
# 在 server { } 块内、任意 location 之前，加入下面这段。
#
# 或者更简单：宝塔 → 网站 → 设置 → 伪静态里无法放 location，
# 请改用「配置文件」标签页，把这段加到 server{} 里。
# =====================================================

# 禁止公网访问数据目录（防止反馈/用户数据被下载）
location ^~ /data/ {
    deny all;
    return 404;
}

# 禁止直接访问各类敏感文件（.json/.log/.sql/.md 等）
location ~* \.(json|log|bak|sql|md)$ {
    deny all;
    return 404;
}
