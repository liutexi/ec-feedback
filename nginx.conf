# =====================================================
# 云湖反馈机器人 - 宝塔伪静态规则（Nginx）
# 用法：宝塔 → 网站 → feedback.yh.ltx88.icu → 设置 → 伪静态
#       把下面内容整个粘贴进去 → 保存 → 重载 Nginx
#
# 注意：宝塔「伪静态」框的内容会自动放入 location / { } 内，
#       所以这里只能写 rewrite / if 等指令，不能写 location 块。
# =====================================================

# 点赞接口：/feedback/编号/like
rewrite ^/feedback/([A-Za-z0-9\-]+)/like/?$ /feedback.php?no=$1&like=1 last;

# 反馈详情页：/feedback/编号 （含短编号，如 /feedback/001）
rewrite ^/feedback/([A-Za-z0-9\-]+)/?$ /feedback.php?no=$1 last;

# 反馈列表页：/feedback
rewrite ^/feedback/?$ /feedback.php last;

# 管理后台：/fb-admin
rewrite ^/fb-admin/?$ /fb-admin.php last;
